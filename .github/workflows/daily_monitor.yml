name: WWRI Daily Monitor & Alert

on:
  schedule:
    # 1) 매일 오전 07:30 KST (UTC 22:30 전날)
    - cron: '30 22 * * *'
    # 2) 매일 오후 18:00 KST (UTC 09:00 당일)
    - cron: '0 9 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 'Run workflow' 버튼으로 즉시 실행 가능

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 데이터 파일(SQLite) 커밋 & 푸시 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 일일 수집 및 위험도 계산, 알림 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python src/main.py

      - name: 갱신된 데이터베이스(SQLite) 변경사항 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "WWRI Bot"
          git add data/
          if git diff --staged --quiet; then
            echo "변경되거나 추가된 데이터가 없습니다."
          else
            git commit -m "chore(data): auto-update WWRI database [$(date +'%Y-%m-%d')]"
            git push
          fi
